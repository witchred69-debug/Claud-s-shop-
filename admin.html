<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claud's Shop Admin</title>
  <style>
    :root {
      --bg: #0b0f19;
      --bg-soft: #101827;
      --panel: #111827;
      --panel-2: #1f2937;
      --line: rgba(212,175,55,.35);
      --gold: #d4af37;
      --gold-soft: #f6e7a6;
      --text: #f9fafb;
      --muted: #a1a1aa;
      --success: #22c55e;
      --danger: #ef4444;
      --shadow: 0 18px 40px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, rgba(212,175,55,.12), transparent 25%), linear-gradient(160deg, #090d15, #111827 58%, #0d1320);
      color: var(--text);
    }
    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font: inherit; }
    .app-shell { max-width: 1300px; margin: 0 auto; padding: 24px; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 18px 22px; background: rgba(17,24,39,.9);
      border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 24px;
    }
    .brand { font-weight: 700; letter-spacing: .08em; color: var(--gold-soft); }
    .topbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .pill, .danger, .primary, .ghost {
      padding: 10px 16px; border-radius: 12px; border: 1px solid transparent; cursor: pointer; transition: .2s ease;
    }
    .primary { background: linear-gradient(135deg, #bf953f, #e6c667, #aa771c); color: #0b0f19; font-weight: 700; }
    .ghost { background: transparent; color: var(--gold-soft); border-color: var(--line); }
    .danger { background: rgba(239,68,68,.12); color: #fecaca; border-color: rgba(239,68,68,.6); }
    .hidden { display: none !important; }
    .login-wrap { display: grid; place-items: center; min-height: 70vh; }
    .login-card {
      width: min(420px, 100%); background: rgba(17,24,39,.96); padding: 28px 24px; border: 1px solid var(--line); border-radius: 22px;
      box-shadow: var(--shadow);
    }
    .login-card h1 { margin: 0 0 10px; font-size: 1.8rem; }
    .muted { color: var(--muted); }
    .field { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
    .field input, .field textarea, .field select {
      width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(212,175,55,.35); background: rgba(15,23,42,.9); color: var(--text);
    }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px;
    }
    .panel {
      background: rgba(17,24,39,.9); border: 1px solid var(--line); border-radius: 20px; padding: 18px; box-shadow: var(--shadow);
    }
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin-bottom: 22px;
    }
    .stat {
      background: rgba(17,24,39,.85); border: 1px solid var(--line); border-radius: 16px; padding: 18px;
    }
    .stat-label { color: var(--muted); font-size: .82rem; text-transform: uppercase; letter-spacing: .08em; }
    .stat-value { font-size: 1.8rem; margin-top: 10px; font-weight: 700; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
    .section-title { margin: 0 0 14px; font-size: 1.2rem; }
    .product-list, .order-list { display: grid; gap: 14px; }
    .product-item, .order-item {
      border: 1px solid rgba(212,175,55,.25); background: rgba(15,23,42,.78); border-radius: 14px; padding: 14px; display: grid; gap: 8px;
    }
    .product-top, .order-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .badge { display: inline-block; padding: 5px 9px; border-radius: 999px; font-size: .72rem; font-weight: 700; }
    .badge.active { background: rgba(34,197,94,.12); color: #bbf7d0; }
    .badge.inactive { background: rgba(239,68,68,.12); color: #fecaca; }
    .row-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .small { font-size: .85rem; color: var(--muted); }
    .product-form, .settings-form { display: grid; gap: 12px; }
    .inline { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; }
    .list-scroll { max-height: 520px; overflow: auto; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { padding: 8px 10px; background: rgba(212,175,55,.12); border: 1px solid var(--line); border-radius: 999px; color: var(--gold-soft); }
    @media (max-width: 700px) { .inline { grid-template-columns: 1fr; } .topbar { flex-direction: column; align-items: flex-start; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="login-view" class="login-wrap">
      <div class="login-card">
        <h1>Claud's Shop Admin</h1>
        <p class="muted">Unesite lozinku za admin panel.</p>
        <div class="field">
          <label for="admin-password">Lozinka</label>
          <input id="admin-password" type="password" placeholder="••••••••" />
        </div>
        <div class="toolbar" style="margin-top:18px">
          <button id="login-btn" class="primary" type="button">Prijavi se</button>
        </div>
      </div>
    </div>

    <div id="admin-view" class="hidden">
      <header class="topbar">
        <div class="brand">CLAUD'S SHOP ADMIN</div>
        <div class="topbar-actions">
          <button id="sync-demo" class="ghost" type="button">Učitaj demo podatke</button>
          <button id="save-all" class="primary" type="button">Spremi promjene</button>
          <button id="logout-btn" class="danger" type="button">Odjava</button>
        </div>
      </header>

      <section class="stats">
        <div class="stat">
          <div class="stat-label">Proizvodi</div>
          <div id="total-products" class="stat-value">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Aktivni</div>
          <div id="active-products" class="stat-value">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Kategorije</div>
          <div id="category-count" class="stat-value">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Narudžbe</div>
          <div id="order-count" class="stat-value">0</div>
        </div>
      </section>

      <div class="grid">
        <section class="panel">
          <h2 class="section-title">Dodaj / uredi proizvod</h2>
          <form id="product-form" class="product-form">
            <input id="product-id" type="hidden">
            <div class="field">
              <label for="product-title">Naziv proizvoda</label>
              <input id="product-title" type="text" placeholder="npr. Retro torba">
            </div>
            <div class="inline">
              <div class="field">
                <label for="product-category">Kategorija</label>
                <select id="product-category"></select>
              </div>
              <div class="field">
                <label for="product-price">Cijena (€)</label>
                <input id="product-price" type="number" min="0" step="0.01" placeholder="39.99">
              </div>
            </div>
            <div class="inline">
              <div class="field">
                <label for="product-condition">Stanje</label>
                <input id="product-condition" type="text" placeholder="Kao novo">
              </div>
              <div class="field">
                <label for="product-image">Slika URL</label>
                <input id="product-image" type="url" placeholder="https://...jpg">
              </div>
            </div>
            <div class="field">
              <label for="product-desc">Opis</label>
              <textarea id="product-desc" rows="4" placeholder="Opis proizvoda..."></textarea>
            </div>
            <label class="checkbox-row">
              <input id="product-active" type="checkbox" checked>
              <span>Aktivan na web stranici</span>
            </label>
            <div class="toolbar">
              <button type="submit" class="primary">Spremi proizvod</button>
              <button id="reset-product" type="button" class="ghost">Novi proizvod</button>
            </div>
          </form>
        </section>

        <section class="panel">
          <h2 class="section-title">Opcije stranice</h2>
          <form id="settings-form" class="settings-form">
            <div class="inline">
              <div class="field">
                <label for="shop-name">Naziv trgovine</label>
                <input id="shop-name" type="text" placeholder="Claud's Shop">
              </div>
              <div class="field">
                <label for="shop-eyebrow">Tagline</label>
                <input id="shop-eyebrow" type="text" placeholder="Privatna kolekcija">
              </div>
            </div>
            <div class="field">
              <label for="hero-title-field">Naslov hero sekcije</label>
              <input id="hero-title-field" type="text" placeholder="Claud's Shop">
            </div>
            <div class="field">
              <label for="hero-text-field">Opis hero sekcije</label>
              <textarea id="hero-text-field" rows="3" placeholder="Opis..."></textarea>
            </div>
            <div class="inline">
              <div class="field">
                <label for="bank-name-field">Naziv primatelja</label>
                <input id="bank-name-field" type="text">
              </div>
              <div class="field">
                <label for="bank-iban-field">IBAN</label>
                <input id="bank-iban-field" type="text">
              </div>
            </div>
            <div class="inline">
              <div class="field">
                <label for="bank-model-field">Model</label>
                <input id="bank-model-field" type="text">
              </div>
              <div class="field">
                <label for="bank-reference-field">Poziv na broj</label>
                <input id="bank-reference-field" type="text">
              </div>
            </div>
            <div class="field">
              <label for="payment-link-field">Online plaćanje URL</label>
              <input id="payment-link-field" type="url" placeholder="https://example.com/pay">
            </div>
            <div class="field">
              <label for="whatsapp-field">WhatsApp broj</label>
              <input id="whatsapp-field" type="text" placeholder="385955432154">
            </div>
            <button type="submit" class="primary">Spremi opcije</button>
          </form>
        </section>
      </div>

      <section class="panel" style="margin-top:22px;">
        <h2 class="section-title">Kategorije</h2>
        <div id="category-tags" class="tags"></div>
      </section>

      <div class="grid" style="margin-top:22px;">
        <section class="panel">
          <h2 class="section-title">Lista proizvoda</h2>
          <div id="product-list" class="product-list list-scroll"></div>
        </section>

        <section class="panel">
          <h2 class="section-title">Narudžbe</h2>
          <div id="order-list" class="order-list list-scroll"></div>
        </section>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEYS = {
      products: 'clauds_shop_products',
      settings: 'clauds_shop_settings',
      orders: 'clauds_shop_orders',
      auth: 'clauds_admin_logged_in',
      password: 'clauds_admin_password'
    };

    const defaultCategories = [
      'Sve', 'Odjeća', 'Obuća', 'Kućanske stvari', 'Alati', 'Knjige', 'Antikviteti', 'Igračke', 'Stvari za djecu'
    ];

    const defaultSettings = {
      shopName: "Claud's Shop",
      eyebrow: 'Privatna kolekcija',
      heroTitle: "Claud's shop",
      heroText: 'Odabrani komadi iz privatne ponude. Odaberite kategoriju, pregledajte detalje i dodajte željene artikle u košaricu.',
      bankName: 'Klaudija Birkić',
      bankIban: 'HR6423600001300206618',
      bankModel: 'HR00',
      bankReference: '6829324089',
      onlinePaymentUrl: 'https://aircash.eu',
      whatsappNumber: '385955432154'
    };

    const defaultProducts = [
      { id: 1, category: 'Odjeća', title: 'Elegantan crni kaput (vel. M)', condition: 'Kao novo', price: 40, desc: 'Kvalitetan kroj, nošen svega par puta, bez ikakvih tragova korištenja.', img: '', active: true },
      { id: 2, category: 'Obuća', title: 'Kožne gležnjače (br. 39)', condition: 'Odlično stanje', price: 35, desc: 'Prava brušena koža, vrlo udobne i očuvane, dolaze u originalnoj kutiji.', img: '', active: true },
      { id: 3, category: 'Kućanske stvari', title: 'Set porculanskih šalica za kavu', condition: 'Nekorišteno', price: 25, desc: 'Komplet od 6 šalica sa zlatnim rubom, nekorišteno, u ukrasnoj kutiji.', img: '', active: true },
      { id: 4, category: 'Alati', title: 'Akumulatorska bušilica s koferom', condition: 'Ispravno / Očuvano', price: 60, desc: 'Komplet s punjačem, dvije ispravne baterije i setom svrdala u čvrstom kovinskom koferu.', img: '', active: true }
    ];

    const sampleOrders = [
      { id: 'ORD-1001', customer: 'Ana', total: 75, status: 'pending', items: ['Kaput', 'Gležnjače'] },
      { id: 'ORD-1002', customer: 'Marko', total: 40, status: 'confirmed', items: ['Set šalica'] }
    ];

    let products = loadProducts();
    let orders = loadOrders();
    let settings = loadSettings();

    function loadProducts() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.products);
        return raw ? JSON.parse(raw) : defaultProducts;
      } catch {
        return defaultProducts;
      }
    }

    function saveProducts() {
      localStorage.setItem(STORAGE_KEYS.products, JSON.stringify(products));
    }

    function loadSettings() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.settings);
        return raw ? { ...defaultSettings, ...JSON.parse(raw) } : { ...defaultSettings };
      } catch {
        return { ...defaultSettings };
      }
    }

    function saveSettings() {
      localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(settings));
    }

    function loadOrders() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.orders);
        return raw ? JSON.parse(raw) : sampleOrders;
      } catch {
        return sampleOrders;
      }
    }

    function saveOrders() {
      localStorage.setItem(STORAGE_KEYS.orders, JSON.stringify(orders));
    }

    function setAdminAuthenticated(value) {
      localStorage.setItem(STORAGE_KEYS.auth, value ? 'yes' : 'no');
      document.getElementById('login-view').classList.toggle('hidden', value);
      document.getElementById('admin-view').classList.toggle('hidden', !value);
    }

    function ensureDefaultPassword() {
      const current = localStorage.getItem(STORAGE_KEYS.password);
      if (!current) localStorage.setItem(STORAGE_KEYS.password, 'clauds-admin');
    }

    function isAuthenticated() {
      return localStorage.getItem(STORAGE_KEYS.auth) === 'yes';
    }

    function updateStats() {
      document.getElementById('total-products').textContent = String(products.length);
      document.getElementById('active-products').textContent = String(products.filter(p => p.active !== false).length);
      document.getElementById('category-count').textContent = String(defaultCategories.length);
      document.getElementById('order-count').textContent = String(orders.length);
    }

    function populateCategorySelect() {
      const select = document.getElementById('product-category');
      select.innerHTML = defaultCategories.filter(category => category !== 'Sve').map(category => `<option value="${category}">${category}</option>`).join('');
    }

    function fillSettingsForm() {
      document.getElementById('shop-name').value = settings.shopName || '';
      document.getElementById('shop-eyebrow').value = settings.eyebrow || '';
      document.getElementById('hero-title-field').value = settings.heroTitle || '';
      document.getElementById('hero-text-field').value = settings.heroText || '';
      document.getElementById('bank-name-field').value = settings.bankName || '';
      document.getElementById('bank-iban-field').value = settings.bankIban || '';
      document.getElementById('bank-model-field').value = settings.bankModel || '';
      document.getElementById('bank-reference-field').value = settings.bankReference || '';
      document.getElementById('payment-link-field').value = settings.onlinePaymentUrl || '';
      document.getElementById('whatsapp-field').value = settings.whatsappNumber || '';
    }

    function renderCategoriesTags() {
      const container = document.getElementById('category-tags');
      container.innerHTML = defaultCategories.filter(c => c !== 'Sve').map(category => `<span class="tag">${category}</span>`).join('');
    }

    function renderProductsList() {
      const list = document.getElementById('product-list');
      if (!products.length) {
        list.innerHTML = '<div class="small">Nema proizvoda.</div>';
        return;
      }
      list.innerHTML = products.map(product => `
        <div class="product-item">
          <div class="product-top">
            <strong>${product.title}</strong>
            <span class="badge ${product.active === false ? 'inactive' : 'active'}">${product.active === false ? 'Neaktivan' : 'Aktivan'}</span>
          </div>
          <div class="small">${product.category} • ${product.condition} • ${Number(product.price).toFixed(2)} €</div>
          <div class="row-actions">
            <button class="ghost" type="button" data-edit-id="${product.id}">Uredi</button>
            <button class="danger" type="button" data-delete-id="${product.id}">Obriši</button>
          </div>
        </div>
      `).join('');
    }

    function renderOrdersList() {
      const list = document.getElementById('order-list');
      if (!orders.length) {
        list.innerHTML = '<div class="small">Nema narudžbi.</div>';
        return;
      }
      list.innerHTML = orders.map(order => `
        <div class="order-item">
          <div class="order-top">
            <strong>${order.id}</strong>
            <span class="badge ${order.status === 'pending' ? 'inactive' : 'active'}">${order.status}</span>
          </div>
          <div class="small">Kupac: ${order.customer || 'Nepoznat'} • Ukupno: ${Number(order.total || 0).toFixed(2)} €</div>
          <div class="small">Artikli: ${(order.items || []).join(', ')}</div>
        </div>
      `).join('');
    }

    function resetProductForm() {
      document.getElementById('product-form').reset();
      document.getElementById('product-id').value = '';
      document.getElementById('product-active').checked = true;
      document.getElementById('product-category').value = 'Odjeća';
    }

    function loadProductIntoForm(id) {
      const product = products.find(item => Number(item.id) === Number(id));
      if (!product) return;
      document.getElementById('product-id').value = product.id;
      document.getElementById('product-title').value = product.title || '';
      document.getElementById('product-category').value = product.category || 'Odjeća';
      document.getElementById('product-price').value = product.price ?? 0;
      document.getElementById('product-condition').value = product.condition || '';
      document.getElementById('product-image').value = product.img || '';
      document.getElementById('product-desc').value = product.desc || '';
      document.getElementById('product-active').checked = product.active !== false;
    }

    function saveCurrentProduct() {
      const idValue = document.getElementById('product-id').value;
      const title = document.getElementById('product-title').value.trim();
      const price = Number(document.getElementById('product-price').value);
      const category = document.getElementById('product-category').value;
      const condition = document.getElementById('product-condition').value.trim() || 'Očuvano';
      const image = document.getElementById('product-image').value.trim();
      const desc = document.getElementById('product-desc').value.trim();
      const active = document.getElementById('product-active').checked;

      if (!title || !Number.isFinite(price)) {
        alert('Unesite ispravan naziv i cijenu.');
        return;
      }

      if (idValue) {
        products = products.map(product => Number(product.id) === Number(idValue)
          ? { ...product, title, category, price, condition, img: image, desc, active }
          : product);
      } else {
        const nextId = products.length ? Math.max(...products.map(item => Number(item.id))) + 1 : 1;
        products.unshift({ id: nextId, title, category, price, condition, img: image, desc, active });
      }

      saveProducts();
      renderProductsList();
      updateStats();
      resetProductForm();
      alert('Proizvod je spremljen.');
    }

    function promptDeleteProduct(id) {
      const product = products.find(item => Number(item.id) === Number(id));
      if (!product) return;
      const confirmed = window.confirm(`Obrisati proizvod "${product.title}"?`);
      if (!confirmed) return;
      products = products.filter(item => Number(item.id) !== Number(id));
      saveProducts();
      renderProductsList();
      updateStats();
    }

    function saveSettingsForm(event) {
      event.preventDefault();
      settings = {
        ...settings,
        shopName: document.getElementById('shop-name').value.trim() || defaultSettings.shopName,
        eyebrow: document.getElementById('shop-eyebrow').value.trim() || defaultSettings.eyebrow,
        heroTitle: document.getElementById('hero-title-field').value.trim() || defaultSettings.heroTitle,
        heroText: document.getElementById('hero-text-field').value.trim() || defaultSettings.heroText,
        bankName: document.getElementById('bank-name-field').value.trim() || defaultSettings.bankName,
        bankIban: document.getElementById('bank-iban-field').value.trim() || defaultSettings.bankIban,
        bankModel: document.getElementById('bank-model-field').value.trim() || defaultSettings.bankModel,
        bankReference: document.getElementById('bank-reference-field').value.trim() || defaultSettings.bankReference,
        onlinePaymentUrl: document.getElementById('payment-link-field').value.trim() || defaultSettings.onlinePaymentUrl,
        whatsappNumber: document.getElementById('whatsapp-field').value.trim() || defaultSettings.whatsappNumber
      };
      saveSettings();
      alert('Opcije stranice su spremljene.');
    }

    function handleLogin() {
      const password = document.getElementById('admin-password').value;
      const correctPassword = localStorage.getItem(STORAGE_KEYS.password) || 'clauds-admin';
      if (password === correctPassword) {
        setAdminAuthenticated(true);
      } else {
        alert('Neispravna lozinka.');
      }
    }

    function handleLogout() {
      setAdminAuthenticated(false);
      document.getElementById('admin-password').value = '';
    }

    function loadDemoData() {
      products = [...defaultProducts];
      orders = [...sampleOrders];
      saveProducts();
      saveOrders();
      renderProductsList();
      renderOrdersList();
      updateStats();
    }

    document.getElementById('login-btn').addEventListener('click', handleLogin);
    document.getElementById('logout-btn').addEventListener('click', handleLogout);
    document.getElementById('save-all').addEventListener('click', () => {
      saveProducts();
      saveOrders();
      saveSettings();
      alert('Sve promjene su spremljene.');
    });
    document.getElementById('sync-demo').addEventListener('click', loadDemoData);
    document.getElementById('product-form').addEventListener('submit', (event) => {
      event.preventDefault();
      saveCurrentProduct();
    });
    document.getElementById('settings-form').addEventListener('submit', saveSettingsForm);
    document.getElementById('reset-product').addEventListener('click', resetProductForm);
    document.getElementById('product-list').addEventListener('click', (event) => {
      const editButton = event.target.closest('[data-edit-id]');
      const deleteButton = event.target.closest('[data-delete-id]');
      if (editButton) loadProductIntoForm(editButton.dataset.editId);
      if (deleteButton) promptDeleteProduct(deleteButton.dataset.deleteId);
    });

    ensureDefaultPassword();
    populateCategorySelect();
    fillSettingsForm();
    renderCategoriesTags();
    renderProductsList();
    renderOrdersList();
    updateStats();
    setAdminAuthenticated(isAuthenticated());
  </script>
</body>
</html>

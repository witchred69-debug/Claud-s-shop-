<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Claud's Shop — Admin</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#f5f5f5;background:#09090b;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#09090b,#171410)}
    main{max-width:760px;margin:auto;padding:32px 16px}.card{border:1px solid #d4af3766;border-radius:18px;background:#171410;padding:22px}
    h1{font-family:Georgia,serif}.field{display:block;margin:14px 0}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #d4af3766;border-radius:10px;background:#0d0c0a;color:#fff;margin-top:6px}
    button{padding:11px 16px;border:0;border-radius:10px;background:#e1c269;color:#09090b;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.hidden{display:none}
    #status{min-height:24px;color:#e8d79a}.error{color:#fca5a5}.product{border-bottom:1px solid #d4af3722;padding:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.danger{background:#7f1d1d;color:#fff}.muted{color:#a1a1aa}
  </style>
</head>
<body><main>
  <div id="login" class="card"><h1>Claud's Shop — Admin</h1><p class="muted">Prijava se obavlja povezanim e-mailom. Nema lozinke.</p>
    <label class="field">Administratorski e-mail<input id="email" type="email" autocomplete="email" required></label>
    <button id="send-link" type="button">Pošalji sigurnu prijavu</button><p id="status"></p>
  </div>
  <section id="panel" class="card hidden"><h1>Artikli</h1><p id="status2"></p>
    <form id="product-form">
      <label class="field">Kategorija<select id="category" required><option>Odjeća</option><option>Obuća</option><option>Kućanske stvari</option><option>Alati</option><option>Knjige</option><option>Antikviteti</option><option>Igračke</option><option>Stvari za djecu</option></select></label>
      <label class="field">Naziv<input id="title" maxlength="120" required></label>
      <label class="field">Stanje<input id="condition" maxlength="80" value="Očuvano"></label>
      <label class="field">Cijena (€)<input id="price" type="number" min="0" step="0.01" required></label>
      <label class="field">Opis<textarea id="desc" maxlength="1000"></textarea></label>
      <label class="field">HTTPS poveznica slike<input id="img" type="url" placeholder="https://..."></label>
      <button type="submit">Dodaj artikl</button>
    </form><div id="products"></div>
  </section>
</main>
<script>
'use strict';
const API='https://REPLACE_WITH_API_URL';
const SUPABASE_URL='https://REPLACE_WITH_PROJECT.supabase.co';
const SUPABASE_ANON='REPLACE_WITH_ANON_KEY';
let session=null;
const $=id=>document.getElementById(id);const status=(id,text,error=false)=>{const e=$(id);e.textContent=text;e.className=error?'error':''};
async function supabase(path,init={}){const r=await fetch(SUPABASE_URL+'/auth/v1/'+path,{...init,headers:{apikey:SUPABASE_ANON,'Content-Type':'application/json',...(init.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.msg||j.error_description||'Greška prijave');return j}
$('send-link').addEventListener('click',async()=>{const email=$('email').value.trim();if(!email)return status('status','Unesite e-mail.',true);try{await supabase('magiclink',{method:'POST',body:JSON.stringify({email,options:{emailRedirectTo:location.origin+location.pathname}})});status('status','Poveznica za prijavu poslana je na e-mail.')}catch(e){status('status',e.message,true)}});
async function load(){const hash=new URLSearchParams(location.hash.slice(1));if(hash.has('access_token')){session={access_token:hash.get('access_token')};history.replaceState(null,'',location.pathname)}if(!session)return;try{const u=await supabase('user',{headers:{Authorization:'Bearer '+session.access_token}});if(!u.email)throw new Error('Prijava nije uspješna');$('login').classList.add('hidden');$('panel').classList.remove('hidden');await list()}catch(e){status('status',e.message,true)}}
async function api(path,options={}){const r=await fetch(API+path,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token,...(options.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Greška API-ja');return j}
async function list(){try{const a=await api('/api/admin/products');$('products').innerHTML=a.map(p=>`<div class="product"><strong>${escapeHTML(p.title)}</strong> — ${Number(p.price).toFixed(2)} €<div class="row"><button type="button" onclick="toggle(${p.id},${!p.active})">${p.active?'Sakrij':'Aktiviraj'}</button><button class="danger" type="button" onclick="removeProduct(${p.id})">Obriši</button></div></div>`).join('')}catch(e){status('status2',e.message,true)}}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]))}
$('product-form').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/admin/products',{method:'POST',body:JSON.stringify({category:$('category').value,title:$('title').value.trim(),condition:$('condition').value.trim(),price:Number($('price').value),desc:$('desc').value.trim(),img:$('img').value.trim()})});e.target.reset();$('condition').value='Očuvano';await list();status('status2','Artikl je dodan.') }catch(x){status('status2',x.message,true)}});
window.toggle=async(id,active)=>{try{await api('/api/admin/products/'+id,{method:'PATCH',body:JSON.stringify({active})});await list()}catch(e){status('status2',e.message,true)}};
window.removeProduct=async(id)=>{if(!confirm('Obrisati artikl?'))return;try{await api('/api/admin/products/'+id,{method:'DELETE'});await list()}catch(e){status('status2',e.message,true)}};
load();
</script></body></html>

<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>Claud's Shop</title>
  <style>
    :root{--bg:#09090b;--panel:#171410;--gold:#d4af37;--gold-light:#fcf6ba;--text:#f4f4f5;--muted:#a1a1aa;--line:rgba(212,175,55,.35)}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#241d12 0,#09090b 38%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:rgba(9,9,11,.96)}
    .brand{font-family:Georgia,serif;font-size:20px;font-weight:800;color:var(--gold-light);letter-spacing:1px} button,a{font:inherit} button{cursor:pointer}
    .cart{border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--gold-light);padding:9px 13px}
    main{max-width:1100px;margin:auto;padding:28px 16px}.hero{text-align:center;padding:20px 0 28px}.hero span{color:var(--gold-light);font-size:12px;text-transform:uppercase;letter-spacing:2px}.hero h1{font-family:Georgia,serif;font-size:clamp(42px,12vw,76px);margin:12px 0;color:var(--gold-light)}.hero p{max-width:650px;margin:auto;color:#d4d4d8}
    .categories{display:flex;gap:8px;overflow-x:auto;padding:6px 0 18px}.category{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--text);padding:9px 14px}.category.active{background:var(--gold);color:#09090b;border-color:var(--gold-light)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.card{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:linear-gradient(160deg,#1b1814,#0f0d0b)}.card img{width:100%;height:220px;object-fit:cover;background:#14120f}.body{padding:14px}.category-name{color:var(--gold);font-size:11px;text-transform:uppercase}.body h2{font-size:17px;margin:7px 0}.body p{min-height:54px;margin:8px 0;color:var(--muted);font-size:13px}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.price{font-size:20px;font-weight:800}.add{border:0;border-radius:10px;background:linear-gradient(135deg,#bf953f,#e6c667,#aa771c);color:#09090b;padding:9px 12px;font-weight:800}
    .empty{text-align:center;padding:40px;color:var(--muted)}.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.85)}.modal.open{display:flex}.modal-card{width:min(480px,100%);max-height:85vh;overflow:auto;border:1px solid var(--line);border-radius:18px;background:#171410;padding:18px}.modal-card h2{margin-top:0}.close{float:right;border:0;background:transparent;color:var(--text);font-size:24px}.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(212,175,55,.15)}.remove{border:1px solid rgba(239,68,68,.4);border-radius:8px;background:rgba(239,68,68,.15);color:#fca5a5;padding:6px 8px}.checkout{width:100%;margin-top:14px;border:0;border-radius:10px;background:linear-gradient(135deg,#bf953f,#e6c667,#aa771c);color:#09090b;padding:12px;font-weight:800}.total{display:flex;justify-content:space-between;margin-top:14px;font-weight:800}
    footer{text-align:center;border-top:1px solid var(--line);padding:22px;color:var(--muted);font-size:12px}
  </style>
</head>
<body>
  <header><div class="brand">CLAUD'S SHOP</div><button class="cart" id="open-cart" type="button">Košarica (<span id="count">0</span>)</button></header>
  <main>
    <section class="hero"><span>Privatna kolekcija</span><h1>Claud's shop</h1><p>Odabrani komadi iz privatne ponude. Odaberi kategoriju i dodaj željene artikle u košaricu.</p></section>
    <div class="categories" id="categories"></div>
    <section class="grid" id="products" aria-live="polite"></section>
  </main>
  <footer>CLAUD'S SHOP • Privatna prodaja očuvanih predmeta</footer>

  <div class="modal" id="cart-modal" role="dialog" aria-modal="true" aria-labelledby="cart-title">
    <div class="modal-card"><button class="close" id="close-cart" type="button" aria-label="Zatvori">×</button><h2 id="cart-title">Vaša košarica</h2><div id="cart-items"></div><div class="total"><span>Ukupno</span><span id="cart-total">0 €</span></div><button class="checkout" id="checkout" type="button">Pošalji narudžbu na WhatsApp</button></div>
  </div>

  <script>
    const categories=['Sve','Odjeća','Obuća','Kućanske stvari','Alati','Knjige','Antikviteti','Igračke','Stvari za djecu'];
    let active='Sve', products=[], cart=[];
    const fallback='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500"><rect width="100%" height="100%" fill="#171410"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#d4af37" font-family="sans-serif" font-size="28">Claud\'s Shop</text></svg>');
    const money=new Intl.NumberFormat('hr-HR',{minimumFractionDigits:2,maximumFractionDigits:2});
    const escape=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function load(){try{const r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();products=Array.isArray(d.products)?d.products:[]}catch(e){products=[]}renderCategories();renderProducts();}
    function renderCategories(){document.getElementById('categories').innerHTML=categories.map(c=>`<button class="category ${c===active?'active':''}" type="button" data-category="${escape(c)}">${escape(c)}</button>`).join('')}
    function renderProducts(){const visible=active==='Sve'?products:products.filter(p=>p.category===active);const el=document.getElementById('products');if(!visible.length){el.innerHTML='<div class="empty" style="grid-column:1/-1">Trenutno nema proizvoda u ovoj kategoriji.</div>';return}el.innerHTML=visible.map(p=>`<article class="card"><img src="${escape(p.img||fallback)}" alt="${escape(p.title)}"><div class="body"><div class="category-name">${escape(p.category)}</div><h2>${escape(p.title)}</h2><p>${escape(p.desc||p.description||'')}</p><div class="foot"><span class="price">${money.format(Number(p.price)||0)} €</span><button class="add" type="button" data-add="${escape(p.id)}">Dodaj</button></div></div></article>`).join('');el.querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>img.src=fallback,{once:true}))}
    function updateCart(){document.getElementById('count').textContent=cart.length;const el=document.getElementById('cart-items');el.innerHTML=cart.length?cart.map((p,i)=>`<div class="item"><div><strong>${escape(p.title)}</strong><br>${money.format(Number(p.price)||0)} €</div><button class="remove" type="button" data-remove="${i}">Ukloni</button></div>`).join(''):'<p>Košarica je prazna.</p>';document.getElementById('cart-total').textContent=money.format(cart.reduce((s,p)=>s+(Number(p.price)||0),0))+' €'}
    document.getElementById('categories').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;active=b.dataset.category;renderCategories();renderProducts()});
    document.getElementById('products').addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(!b)return;const p=products.find(x=>String(x.id)===String(b.dataset.add));if(p&&!cart.some(x=>String(x.id)===String(p.id))){cart.push(p);updateCart()}});
    document.getElementById('cart-items').addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(!b)return;cart.splice(Number(b.dataset.remove),1);updateCart()});
    document.getElementById('open-cart').addEventListener('click',()=>document.getElementById('cart-modal').classList.add('open'));document.getElementById('close-cart').addEventListener('click',()=>document.getElementById('cart-modal').classList.remove('open'));document.getElementById('cart-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open')});
    document.getElementById('checkout').addEventListener('click',()=>{if(!cart.length){alert('Košarica je prazna.');return}const lines=cart.map(p=>'- '+p.title+' ('+money.format(Number(p.price)||0)+' €)').join('\n');const message='Pozdrav! Želim naručiti iz Claud\'s shopa:\n\n'+lines+'\n\nUKUPNO: '+money.format(cart.reduce((s,p)=>s+(Number(p.price)||0),0))+' €';window.open('https://wa.me/385955432154?text='+encodeURIComponent(message),'_blank','noopener,noreferrer')});
    load();updateCart();
  </script>
</body>
</html>

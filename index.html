function compressImage(file, callback) {
const reader = new FileReader();
reader.onload = function(event) {
const img = new Image();
img.onload = function() {
const canvas = document.createElement('canvas');
const maxWidth = 700;
const scale = Math.min(1, maxWidth / img.width);
canvas.width = img.width * scale;
canvas.height = img.height * scale;
const ctx = canvas.getContext('2d');
ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
callback(canvas.toDataURL('image/jpeg', 0.75));
};
img.src = event.target.result;
};
reader.readAsDataURL(file);
}
function adminAddProduct() {
const cat = document.getElementById('admin-cat').value;
const title = document.getElementById('admin-title').value.trim();
const condition = document.getElementById('admin-condition').value.trim() || "Očuvano";
const price = parseFloat(document.getElementById('admin-price').value);
const desc = document.getElementById('admin-desc').value.trim() || "Očuvan predmet iz privatne kolekcije.";
const urlInput = document.getElementById('admin-img-url').value.trim();
const fileInput = document.getElementById('admin-file');
if (!title || isNaN(price)) {
alert("Upiši barem naziv proizvoda i cijenu.");
return;
}
const finalizeAdd = (imageSrc) => {
const newProd = {
id: Date.now(),
category: cat,
title: title,
condition: condition,
price: price,
desc: desc,
img: imageSrc || "unsplash.com"
};
products.unshift(newProd);
saveProductsToLocal();
renderProducts();
renderAdminList();
document.getElementById('admin-title').value = "";
document.getElementById('admin-condition').value = "";
document.getElementById('admin-price').value = "";
document.getElementById('admin-desc').value = "";
document.getElementById('admin-img-url').value = "";
fileInput.value = "";
alert("Proizvod je uspješno dodan!");
};
if (fileInput.files && fileInput.files[0]) {
compressImage(fileInput.files[0], finalizeAdd);
} else {
finalizeAdd(urlInput);
}
}
function adminDeleteProduct(index) {
if (confirm("Jesi li sigurna da želiš obrisati ovaj proizvod?")) {
products.splice(index, 1);
saveProductsToLocal();
renderProducts();
renderAdminList();
}
}
